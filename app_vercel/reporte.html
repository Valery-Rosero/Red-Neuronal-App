<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informe del taller LSTM</title>
  <meta name="description" content="Informe del taller de prediccion de demanda electrica con LSTM.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .visor-contenedor { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
    .visor-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .visor-cabecera h1 { margin: 0; font-size: 1.25rem; }
    .visor-pdf { display: block; width: 100%; height: calc(100vh - 180px); min-height: 620px; border: 1px solid #d6d5d0; border-radius: 8px; background: #f4f3f0; }
    .alternativa { margin-top: 10px; }
    @media (max-width: 650px) {
      .visor-cabecera { align-items: flex-start; flex-direction: column; }
      .visor-pdf { height: calc(100vh - 220px); min-height: 520px; }
    }
    @media print { body { display: none !important; } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="contenedor nav-in">
      <a class="marca" href="./"><span class="marca-txt">Demanda LSTM</span></a>
      <div class="nav-links">
        <a href="./">Prediccion</a>
        <a href="informe.html">Resultados y analisis</a>
        <a href="reporte.html" class="activo" aria-current="page">Informe</a>
      </div>
    </div>
  </nav>
  <main class="visor-contenedor">
    <header class="visor-cabecera">
      <h1>Informe del taller</h1>
      <a class="btn" href="Informe_Taller_LSTM.pdf" download>Descargar PDF</a>
    </header>
    <iframe class="visor-pdf" src="Informe_Taller_LSTM.pdf#toolbar=0&navpanes=0" title="Informe del taller en PDF">
      Tu navegador no puede mostrar el PDF.
    </iframe>
    <p class="alternativa">Si no ves el informe, <a href="Informe_Taller_LSTM.pdf" download>descarga el PDF</a>.</p>
  </main>
  <script>
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "p") {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
  </script>
</body>
</html>
